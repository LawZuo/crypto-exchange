server:
  port: 80 # 本地默认80端口，spring默认8080端口
spring:
  application:
    name: gateway
  profiles:
    include:
      - route
      - redis
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        import-check:
          enabled: false

security:
  ignore-paths:
    - /api/crypto-exchange/auth/login
    - /api/crypto-exchange/auth/register
    - /api/crypto-exchange/auth/logout
    - /swagger-ui.html
    - /swagger-ui/**
    - /webjars/**
    - /v3/api-docs/**
    - /api/crypto-exchange/files/**

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls-primary-name: auth
    urls:
      - name: auth
        url: /v3/api-docs/auth
      - name: user
        url: /v3/api-docs/user

exchange:
  doc:
    title: Crypto Exchange Gateway API
    description: 网关接口文档聚合入口
    version: 1.0
