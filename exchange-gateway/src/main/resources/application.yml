server:
  port: 80 # 本地默认80端口，spring默认8080端口
spring:
  application:
    name: gateway
  profiles:
    include:
      - route
      - redis
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        import-check:
          enabled: false

security:
  ignore-paths:
    - /api/crypto-exchange/auth/login
    - /api/crypto-exchange/auth/register
    - /api/crypto-exchange/auth/logout
