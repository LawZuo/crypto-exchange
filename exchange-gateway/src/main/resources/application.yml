server:
  port: ${GATEWAY_PORT:18080}
spring:
  application:
    name: exchange-gateway
  profiles:
    include:
      - route
      - redis
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:LawZhuo1002.}
      discovery:
        enabled: true
        server-addr: ${NACOS_SERVER_ADDR:106.12.183.54:8848}
        namespace: ${NACOS_NAMESPACE:crypto-exchange-local}
      config:
        import-check:
          enabled: false

security:
  ignore-paths:
    - /api/crypto-exchange/web/auth/login
    - /api/crypto-exchange/web/auth/register
    - /api/crypto-exchange/web/market/**
    - /api/crypto-exchange/web/spot/symbols
    - /ws/market
    - /swagger-ui.html
    - /swagger-ui/**
    - /webjars/**
    - /v3/api-docs/**
    - /api/crypto-exchange/web/v3/api-docs/**
    - /api/crypto-exchange/admin/v3/api-docs/**

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls-primary-name: web
    urls:
      - name: web
        url: /api/crypto-exchange/web/v3/api-docs
      - name: admin
        url: /api/crypto-exchange/admin/v3/api-docs

exchange:
  doc:
    title: Crypto Exchange Gateway API
    description: 网关接口文档聚合入口
    version: 1.0
