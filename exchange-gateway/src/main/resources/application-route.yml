spring:
  cloud:
    gateway:
      # cors配置
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins-patterns: "*"
            allowed-methods: "*"
            allowed-headers: "*"
      routes:
        # 文件访问模块
        - id: upload-file-route
          uri: http://localhost:18460
          predicates:
            - Path=/api/crypto-exchange/files/**
          filters:
            - StripPrefix=2

        # 资源服务模块
        - id: service-resource-route
          uri: http://localhost:18460
          predicates:
            - Path=/api/crypto-exchange/upload/** # 文件上传
            - Path=/api/crypto-exchange/email/** # 邮件服务
          filters:
            - StripPrefix=2

        # 鉴权模块
        - id: auth-route
          uri: http://localhost:18400
          predicates:
            - Path=/api/crypto-exchange/auth/**
          filters:
            - StripPrefix=2
