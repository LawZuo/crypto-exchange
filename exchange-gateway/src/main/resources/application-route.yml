spring:
  cloud:
    gateway:
      # cors配置
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins-patterns: "*"
            allowed-methods: "*"
            allowed-headers: "*"
      routes:
        # Auth接口文档
        - id: auth-api-docs
          uri: http://localhost:8080
          predicates:
            - Path=/v3/api-docs/auth
          filters:
            - SetPath=/v3/api-docs
        # 用户接口文档
        - id: user-api-docs
          uri: http://localhost:8081
          predicates:
            - Path=/v3/api-docs/user
          filters:
            - SetPath=/v3/api-docs

        # 文件上传模块
        - id: upload-route
          uri: http://localhost:8079
          predicates:
            - Path=/api/crypto-exchange/upload/**
          filters:
            - StripPrefix=2
        # 文件访问模块
        - id: upload-file-route
          uri: http://localhost:8079
          predicates:
            - Path=/api/crypto-exchange/files/**
          filters:
            - StripPrefix=2
        # 鉴权模块
        - id: auth-route
          uri: http://localhost:8080
          predicates:
            - Path=/api/crypto-exchange/auth/**
          filters:
            - StripPrefix=2
        # 用户模块
        - id: user-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/crypto-exchange/user/**
          filters:
            - StripPrefix=2
