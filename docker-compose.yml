x-service-defaults: &service-defaults
  restart: unless-stopped
  env_file:
    - .env
  environment: &service-environment
    TZ: ${TZ:-Asia/Macau}
    JAVA_OPTS: ${JAVA_OPTS:--Xms128m -Xmx512m -XX:+ExitOnOutOfMemoryError}
    LOG_PATH: /app/logs
    LOGGING_FILE_PATH: /app/logs
    NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR}
    NACOS_NAMESPACE: ${NACOS_NAMESPACE}
    NACOS_USERNAME: ${NACOS_USERNAME}
    NACOS_PASSWORD: ${NACOS_PASSWORD}
    REDIS_HOST: ${REDIS_HOST}
    REDIS_PORT: ${REDIS_PORT}
    REDIS_PASSWORD: ${REDIS_PASSWORD}
    REDIS_DATABASE: ${REDIS_DATABASE:-0}
    REDIS_TIMEOUT: ${REDIS_TIMEOUT:-5000ms}
    DATABASE.REDIS.HOST: ${REDIS_HOST}
    DATABASE.REDIS.PORT: ${REDIS_PORT}
    DATABASE.REDIS.PASSWORD: ${REDIS_PASSWORD}
    DATABASE.REDIS.DATABASE: ${REDIS_DATABASE:-0}
    DATABASE.REDIS.TIMEOUT: ${REDIS_TIMEOUT:-5000ms}
  networks:
    - exchange-network
  mem_limit: ${SERVICE_MEMORY_LIMIT:-768m}

services:
  exchange-gateway:
    <<: *service-defaults
    image: crypto-exchange/gateway:${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        JAR_FILE: jars/exchange-gateway.jar
    ports:
      - "${GATEWAY_HOST_PORT:-18080}:18080"
    volumes:
      - ./logs/exchange-gateway:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/18080'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  exchange-web:
    <<: *service-defaults
    image: crypto-exchange/web:${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        JAR_FILE: jars/exchange-web.jar
    volumes:
      - ./logs/exchange-web:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/18300'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  exchange-admin:
    <<: *service-defaults
    image: crypto-exchange/admin:${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        JAR_FILE: jars/exchange-admin.jar
    volumes:
      - ./logs/exchange-admin:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/18301'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  exchange-auth:
    <<: *service-defaults
    image: crypto-exchange/auth:${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        JAR_FILE: jars/exchange-auth.jar
    volumes:
      - ./logs/exchange-auth:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/18400'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  exchange-business-user:
    <<: *service-defaults
    image: crypto-exchange/business-user:${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        JAR_FILE: jars/exchange-business-user.jar
    volumes:
      - ./logs/exchange-business-user:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/18471'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  exchange-business-account:
    <<: *service-defaults
    image: crypto-exchange/business-account:${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        JAR_FILE: jars/exchange-business-account.jar
    volumes:
      - ./logs/exchange-business-account:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/18472'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  exchange-business-market:
    <<: *service-defaults
    image: crypto-exchange/business-market:${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        JAR_FILE: jars/exchange-business-market.jar
    environment:
      <<: *service-environment
      JAVA_OPTS: ${MARKET_JAVA_OPTS:--Xms256m -Xmx1024m -XX:+ExitOnOutOfMemoryError}
    mem_limit: ${MARKET_MEMORY_LIMIT:-1536m}
    volumes:
      - ./logs/exchange-business-market:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/18470'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  exchange-business-spot:
    <<: *service-defaults
    image: crypto-exchange/business-spot:${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        JAR_FILE: jars/exchange-business-spot.jar
    volumes:
      - ./logs/exchange-business-spot:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/18473'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  exchange-datasource:
    <<: *service-defaults
    image: crypto-exchange/datasource:${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        JAR_FILE: jars/exchange-datasource.jar
    environment:
      <<: *service-environment
      JAVA_OPTS: ${DATASOURCE_JAVA_OPTS:--Xms256m -Xmx768m -XX:+ExitOnOutOfMemoryError}
    mem_limit: ${DATASOURCE_MEMORY_LIMIT:-1g}
    memswap_limit: ${DATASOURCE_MEMORY_SWAP_LIMIT:-2g}
    volumes:
      - ./logs/exchange-datasource:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/18461'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  exchange-resource:
    <<: *service-defaults
    image: crypto-exchange/resource:${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        JAR_FILE: jars/exchange-resource.jar
    environment:
      <<: *service-environment
      FILE_UPLOAD_PATH: /app/uploads/
    volumes:
      - exchange-uploads:/app/uploads
      - ./logs/exchange-resource:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/18460'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

networks:
  exchange-network:
    driver: bridge

volumes:
  exchange-uploads:
