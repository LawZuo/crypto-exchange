spring:
  rabbitmq:
    host: ${RABBITMQ.HOST}
    port: ${RABBITMQ.PORT}
    username: ${RABBITMQ.USERNAME}
    password: ${RABBITMQ.PASSWORD}
    virtual-host: ${RABBITMQ.MARKET_VIRTUAL_HOST:/}
    connection-timeout: 15000
    requested-heartbeat: 30
    publisher-confirm-type: correlated
    publisher-returns: true
