exchange:
  market:
    binance:
      enabled: true
      base-url: wss://data-stream.binance.vision
      rest-base-url: https://data-api.binance.vision
      stream-types:
        - kline
        - depth
        - ticker
        - trade
      kline-interval: 1m
      reconnect-delay: 5s
      timeout-seconds: 30
      snapshot-interval-ms: 1000
