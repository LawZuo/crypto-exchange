server:
  port: ${MODULE_RESOURCE_PORT:8078}

spring:
  application:
    name: service-resource
  profiles:
    active: dev
    include:
      - redis
      - mail
      - integrated-mq
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

file:
  upload-path: ${FILE_UPLOAD_PATH:./uploads/}
  access-path: /files/

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

exchange:
  doc:
    title: Crypto Exchange Resource API
    description: 邮件和文件上传资源服务接口文档
    version: 1.0

bt:
  upstream:
    base-url: ${BT_UPSTREAM_BASE_URL:http://localhost:8078}
