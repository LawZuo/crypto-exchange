server:
  port: 8079
spring:
  profiles:
    active: dev
    include:
      - feign
  application:
    name: service-upload
  servlet:
    multipart:
      max-file-size: 100MB       # 单文件大小限制
      max-request-size: 100MB    # 单次请求大小限制

# 自定义本地存储路径（建议外部化配置）
file:
  upload-path: ${FILE_UPLOAD_PATH:./uploads/}
  access-path: /files/           # 静态资源映射路径

# ===========================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

exchange:
  doc:
    title: Crypto Exchange Auth API
    description: 上传服务接口文档
    version: 1.0
